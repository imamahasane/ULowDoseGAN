# PCDiff-Small on LoDoPaB-CT: the capacity-matched ablation (Table:
# capacity-matched ablation of the physics-consistency loss). Identical to
# lodopab.yaml except base_channels: 128 -> 48 (all other hyperparameters,
# including channel_mult/attention_resolutions/optimization, unchanged), which
# gives ~17.15M trainable parameters -- comparable to CoreDiff's ~16.89M
# (Table: computational cost and throughput). Train the paired
# "Small w/o L_phys" row with the same config plus loss.physics_weight: 0.0
# (e.g. `--config configs/lodopab_small.yaml` and override at the CLI, or
# copy this file and set physics_weight: 0.0).
experiment:
  name: lodopab_pcdiff_small
  out_dir: runs/lodopab
  seed: 1234

data:
  dataset: lodopab
  root: data/lodopab
  split: train
  image_size: [362, 362]
  num_workers: 4

ct:
  geometry: parallel
  angles: 513
  det_count: 513

diffusion:
  T: 250
  beta_schedule: linear
  beta_start: 1.0e-4
  beta_end: 2.0e-2
  predict: eps

model:
  in_channels: 2      # x_t concat c = A*(y)
  out_channels: 1
  base_channels: 48   # only change vs. lodopab.yaml -- capacity-matched to CoreDiff
  channel_mult: [1, 1, 2, 2, 4, 4]
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  num_heads: 4
  dropout: 0.0
  use_checkpoint: false

loss:
  physics_weight: 1.0
  denoising_weight: 1.0
  perceptual:
    enabled: true
    weight: 0.1
    layers: ["relu2_2", "relu3_3"]

optim:
  lr: 2.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  grad_accum_steps: 4
  max_epochs: 200
  early_stop_patience: 25
  save_every_epochs: 10
  scheduler:
    name: ReduceLROnPlateau
    mode: min
    factor: 0.5
    patience: 10
    min_lr: 1.0e-6

train:
  batch_size: 1
  amp: true
  log_every: 50
  val_every_epochs: 1
